<div class="card mb-2" [class.opacity-50]="task.isCompleted">
  <div class="card-body d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-start gap-2">
      <input
        type="checkbox"
        class="form-check-input mt-1"
        [checked]="task.isCompleted"
        (change)="onToggle()"
      />

      <div>
        <h6 class="mb-1" [class.text-decoration-line-through]="task.isCompleted">
          {{ task.title }}
        </h6>
        <p class="mb-1 text-muted small" *ngIf="task.description">{{ task.description }}</p>

        <span class="badge bg-light text-dark me-2" *ngIf="task.categoryName">
          {{ task.categoryName }}
        </span>
        <span class="fw-bold small" [ngClass]="priorityClass">{{ task.priority }}</span>
        <span class="text-muted small ms-2" *ngIf="task.dueDate">до {{ task.dueDate }}</span>
      </div>
    </div>

    <div>
      <button class="btn btn-sm btn-outline-secondary me-1" (click)="onEdit()">Редагувати</button>
      <button class="btn btn-sm btn-outline-danger" (click)="onDelete()">Видалити</button>
    </div>
  </div>
</div>
