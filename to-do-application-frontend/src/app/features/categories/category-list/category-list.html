<div class="container mt-4" style="max-width: 600px">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Категорії</h2>
    <button class="btn btn-outline-secondary" (click)="goBack()">← До задач</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="d-flex gap-2 mb-4">
    <input type="text" class="form-control" placeholder="Назва категорії" formControlName="name" />
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      {{ editingId ? 'Зберегти' : 'Додати' }}
    </button>
    <button type="button" class="btn btn-secondary" *ngIf="editingId" (click)="onCancelEdit()">
      Скасувати
    </button>
  </form>

  <div class="alert alert-danger py-2" *ngIf="errorMessage">{{ errorMessage }}</div>

  <ul class="list-group">
    <li
      class="list-group-item d-flex justify-content-between align-items-center"
      *ngFor="let cat of categories"
    >
      <span
        >{{ cat.name }} <span class="badge bg-secondary ms-2">{{ cat.taskCount }}</span></span
      >
      <div>
        <button class="btn btn-sm btn-outline-secondary me-1" (click)="onEdit(cat)">
          Редагувати
        </button>
        <button class="btn btn-sm btn-outline-danger" (click)="onDelete(cat.id)">Видалити</button>
      </div>
    </li>
  </ul>

  <div class="text-muted text-center mt-3" *ngIf="categories.length === 0">Категорій ще немає</div>
</div>
