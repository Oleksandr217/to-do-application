<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-4 shadow-sm" style="width: 400px">
    <h3 class="text-center mb-4">Вхід</h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" />
        <div
          class="text-danger small"
          *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
        >
          Введіть коректний email
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-control" formControlName="password" />
        <div
          class="text-danger small"
          *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
        >
          Пароль є обов'язковим
        </div>
      </div>

      <div class="alert alert-danger py-2" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || isLoading">
        {{ isLoading ? 'Вхід...' : 'Увійти' }}
      </button>

      <div class="text-center mt-3">
        Немає акаунту? <a routerLink="/register">Зареєструватись</a>
      </div>
    </form>
  </div>
</div>
